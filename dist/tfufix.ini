; =====================================================================
;  TFU-FPS-Fix 1.0 - Star Wars: The Force Unleashed (PC)
;  Place this file next to SWTFU.exe together with dinput8.dll.
;  Lines starting with ; are comments. Restart the game after changes.
; =====================================================================

[Framerate]
; Frame rate cap. The original game is locked to 30.
; 60 is the tested and recommended value. 0 = original cap (30).
FPSCap=60

[Physics]
; 1 = run the game simulation at a fixed 30 Hz, exactly like the original
;     game, while rendering at FPSCap. This is what fixes the high frame
;     rate physics bugs (Force-gripped objects drifting upward, etc.).
; 0 = raw frame rate unlock only (same as the old FPS patches; physics
;     bugs above 30 FPS are expected).
FixedTimestep=1

[Interpolation]
; 1 = smooth animation between the 30 Hz simulation steps.
; 0 = off. Only works when FixedTimestep=1.
Enabled=1
; Advanced: objects that move further than this between two simulation
; steps are not smoothed (teleports, camera cuts). Leave at 8.
SnapDistance=8

[Display]
; 1 = borderless windowed: looks like fullscreen, instant alt-tab, other
;     windows can be shown on top of the game.
; 0 = the game's own exclusive fullscreen.
Borderless=1

[Debug]
; 1 = write a short status log to tfufix.log next to SWTFU.exe.
Log=1
; 1 = also write statistics every second (only for troubleshooting).
Telemetry=0
